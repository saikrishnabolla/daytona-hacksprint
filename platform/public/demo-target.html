<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample target</title><link rel="stylesheet" href="/typography.css"><style>
*{box-sizing:border-box}body{margin:0;font:var(--text-body)/1.5 var(--font-ui);color:#20243d;background:#fff}nav{height:48px;border-bottom:1px solid #edf0f5;padding:0 20px;display:flex;align-items:center;gap:22px}nav strong{font-size:var(--text-body);margin-right:auto}nav button{font:inherit;font-size:var(--text-label);border:0;background:none;color:#626a82;cursor:pointer}main{padding:20px}h1{margin:0 0 8px;font-size:var(--text-page);letter-spacing:-.8px}p{font-size:var(--text-body);color:#778098;margin:0 0 18px}form{display:flex;gap:9px}input{min-width:0;flex:1;height:35px;border:1px solid #dce0e9;border-radius:4px;padding:0 12px;color:#464d68;background:#fff}button[type=submit],.okay{height:34px;border:1px solid #2673ef;border-radius:4px;background:#2879f5;color:white;padding:0 16px;font-size:var(--text-body);cursor:pointer}#result{margin-top:14px;padding:12px;border:1px solid #eceef4;border-radius:3px;background:#f9fafc;color:#737d93;font-size:var(--text-label);overflow-wrap:anywhere}.proof{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:min(300px,calc(100% - 38px));background:white;border:1px solid #d5d9e2;box-shadow:0 5px 20px #1c21351c;border-radius:6px;padding:17px 18px;z-index:1}.proof[hidden]{display:none}.proof strong{font-size:var(--text-body)}.proof p{color:#29334c;font-size:var(--text-body);margin:16px 0 18px}.proof footer{display:flex;justify-content:flex-end}.proof small{display:block;color:#8a90a0;font-size:var(--text-caption);margin-top:5px}#home[hidden],#search[hidden]{display:none}:focus-visible{outline:2px solid #5949e5;outline-offset:3px}@media(max-width:380px){main{padding:15px}nav{padding:0 15px}}
</style></head><body><nav><strong>Demo app</strong><button id="home-nav">Home</button><button id="search-nav">Search</button><button id="about-nav">About</button></nav><main id="search"><h1>Search</h1><p>Search for articles, products, or anything…</p><form><input aria-label="Search the demo app" value="&lt;img src=x onerror=alert(&quot;demo-proof&quot;)&gt;"><button type="submit">Search</button></form><div id="result">No results found.</div></main><main id="home" hidden><h1>Welcome back.</h1><p>A sample app for the security workspace preview.</p><div id="home-content">Use Search to try the browser interface.</div></main><section class="proof" role="dialog" aria-modal="false" aria-labelledby="proof-title"><strong id="proof-title">target.demo.test says</strong><small>Illustrative browser proof</small><p>demo-proof</p><footer><button class="okay">OK</button></footer></section><script>
const params=new URLSearchParams(location.search),fixed=params.get('fixed')==='1',proof=document.querySelector('.proof'),input=document.querySelector('input'),result=document.querySelector('#result'),search=document.querySelector('#search'),home=document.querySelector('#home');
function showPage(page){search.hidden=page!=='search';home.hidden=page==='search';proof.hidden=true}
if(params.get('page')==='home')showPage('home');
if(fixed){proof.hidden=true;result.textContent='Search input is displayed as text. No proof dialog.'}
document.querySelector('.okay').onclick=()=>{proof.hidden=true};
document.querySelector('#home-nav').onclick=()=>showPage('home');document.querySelector('#search-nav').onclick=()=>showPage('search');document.querySelector('#about-nav').onclick=()=>{showPage('home');document.querySelector('#home-content').textContent='This is an interactive UI sample. No remote target is connected.'};
document.querySelector('form').onsubmit=e=>{e.preventDefault();if(!fixed&&input.value.includes('demo-proof')){proof.hidden=false;result.textContent='Sample browser proof shown.'}else{proof.hidden=true;result.textContent=input.value?'Results for '+input.value+': no matches.':'Enter a search query.'}};
</script></body></html>
